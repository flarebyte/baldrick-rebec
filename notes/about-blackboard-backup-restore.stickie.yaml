note: |-
    Snapshot backups include blackboards and stickies (stores removed). Restore
    order ensures FKs are satisfied; upsert mode updates or inserts rows; replace
    mode truncates then loads. Truncate order includes blackboards so dependent
    stickies cascade on delete when replacing.
